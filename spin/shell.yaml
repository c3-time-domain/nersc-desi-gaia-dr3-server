---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    workload.user.cattle.io/workloadselector: deployment-ls4-nersc-gaia-dr3-shell
  name: shell
  namespace: ls4-nersc-gaia-dr3
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      workload.user.cattle.io/workloadselector: deployment-ls4-nersc-gaia-dr3-shell
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        nersc.gov/collab_uids: "103988"
        nersc.gov/gid: "63477"
        nersc.gov/gids: 63477,96414
        nersc.gov/roles: user
        nersc.gov/uid: "95089"
        nersc.gov/username: raknop
      labels:
        workload.user.cattle.io/workloadselector: deployment-ls4-nersc-gaia-dr3-shell
    spec:
      containers:
      - image: registry.nersc.gov/m4616/rknop/shell:20260603c
        imagePullPolicy: IfNotPresent
        name: shell
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 95089
        stdin: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        tty: true
        volumeMounts:
          - mountPath: /gaia-dr3
            name: gaia-dr3
            readOnly: true
          - mountPath: /source
            name: source-code
      dnsConfig: {}
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 103988
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: registry-nersc
      volumes:
        - hostPath:
            path: /global/cfs/cdirs/m4616/seechange-deployment/production/SeeChange/extern/nersc-desi-gaia-dr3-server
            type: Directory
          name: source-code
        - hostPath:
            path: /global/cfs/cdirs/cosmo/data/gaia/dr3
            type: Directory
          name: gaia-dr3
---
apiVersion: v1
kind: Service
metadata:
  name: shell
  namespace: ls4-nersc-gaia-dr3
spec:
  clusterIP: None
  clusterIPs:
  - None
  ports:
  - name: default
    port: 42
    protocol: TCP
    targetPort: 42
  selector:
    workload.user.cattle.io/workloadselector: deployment-ls4-nersc-gaia-dr3-shell
  sessionAffinity: None
  type: ClusterIP
status:
  loadBalancer: {}
---
