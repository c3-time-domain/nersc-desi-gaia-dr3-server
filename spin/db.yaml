---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ls4-nersc-gaia-dr3
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      workload.user.cattle.io/workloadselector: deployment-ls4-nersc-gaia-dr3-postgres
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        nersc.gov/collab_uids: "101320"
        nersc.gov/gid: "103988"
        nersc.gov/gids: 103988,96414
        nersc.gov/roles: user
        nersc.gov/uid: "95089"
        nersc.gov/username: raknop
      labels:
        workload.user.cattle.io/workloadselector: deployment-ls4-nersc-gaia-dr3-postgres
    spec:
      affinity: {}
      containers:
      - env:
        - name: POSTGRES_DATA_DIR
          value: /var/lib/postgresql/data
        - name: POSTGRES_DBNAME
          value: gaia_dr3_somecols
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secrets
              key: pgpass
        image: registry.nersc.gov/m4616/postgres-q3c:20260603
        imagePullPolicy: IfNotPresent
        name: postgres
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETGID
            - SETUID
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: false
          runAsNonRoot: false
        stdin: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        tty: true
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: postgres
        - mountPath: /dev/shm
          name: dshm
      dnsPolicy: ClusterFirst
      imagePullSecrets:
        - name: registry-nersc
      initContainers:
      - name: volume-mount-hack
        image: busybox
        imagePullPolicy: Always
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        command: [ "sh", "-c", "chown 100:108 /pgdata" ]
        volumeMounts:
        - name: postgres
          mountPath: /pgdata
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: postgres
        persistentVolumeClaim:
          claimName: postgres-rknop-20260603
      - emptyDir:
          medium: Memory
          sizeLimit: 128Gi
        name: dshm
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ls4-nersc-gaia-dr3
spec:
  clusterIP: None
  clusterIPs:
  - None
  ports:
  - name: default
    port: 42
    protocol: TCP
    targetPort: 42
  selector:
    workload.user.cattle.io/workloadselector: deployment-ls4-nersc-gaia-dr3-postgres
  sessionAffinity: None
  type: ClusterIP
status:
  loadBalancer: {}
---
